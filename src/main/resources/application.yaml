spring:
  application:
    name: loveable
server:
  port: 8082
datasource:
    url: jdbc:postgresql://localhost:9001/testDB
    username: testUser
    password: password
    driver-class-name: org.postgresql.Driver

jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
